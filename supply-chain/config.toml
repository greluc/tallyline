
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.embark-studios]
url = "https://raw.githubusercontent.com/EmbarkStudios/rust-ecosystem/main/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.isrg]
url = "https://raw.githubusercontent.com/divviup/libprio-rs/main/supply-chain/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[imports.zcash]
url = "https://raw.githubusercontent.com/zcash/rust-ecosystem/main/supply-chain/audits.toml"

[[exemptions.android-properties]]
version = "0.2.2"
criteria = "safe-to-deploy"
notes = "S-6 justified off-target exemption, not a source-soundness audit: absent from both shipped-target graphs x86_64-pc-windows-msvc and x86_64-unknown-linux-gnu, and native-scope rejects any reachable version including renamed edges. Complete source inspection found unsafe Android bionic-deprecated empty-CString 92-byte output buffer/reconstruction defects and Rust-ABI callback declarations; do not activate Android or conceal these defects. Final filtered metadata and native-scope passed 2026-11-01. Separate suppression register revisit 2027-04-13 or before any activation."

[[exemptions.aws-lc-sys]]
version = "0.46.0"
criteria = "safe-to-deploy"
notes = "AWS-LC C, C++ and assembler sources of about two million lines that cannot be audited by reading; registered native-code exception of ADR-0006"

