name: Core mutation

on:
  pull_request:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

concurrency:
  group: core-mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MUTANTS_VERSION: 27.1.0
      MUTANTS_SHA256: dfe6dc37d0342c891d2829b5a695aa57c2d0edecef7e7d0399a30cc6e206411e
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Verify the compiler reports the pinned version
        run: |
          pinned=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          actual=$(rustc --version | cut -d' ' -f2)
          test -n "$pinned"
          test "$pinned" = "$actual"

      - name: Guard the supply-chain configuration
        run: cargo xtask guard

      - name: Install pinned cargo-mutants
        run: |
          cd "$RUNNER_TEMP"
          archive=cargo-mutants-x86_64-unknown-linux-gnu.tar.gz
          curl --fail --silent --show-error --location --output "$archive" "https://github.com/sourcefrog/cargo-mutants/releases/download/v${MUTANTS_VERSION}/${archive}"
          echo "${MUTANTS_SHA256}  ${archive}" | sha256sum --check -
          mkdir cargo-mutants
          tar -xzf "$archive" -C cargo-mutants
          echo "$RUNNER_TEMP/cargo-mutants" >> "$GITHUB_PATH"

      - name: Verify pinned cargo-mutants
        run: test "$(cargo --locked mutants --version)" = "cargo-mutants ${MUTANTS_VERSION}"

      - name: Test mutations in pull request changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --no-ext-diff --unified=0 "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/core.diff"
          cargo xtask mutation --in-diff "$RUNNER_TEMP/core.diff"

      - name: Test all core mutations nightly
        if: github.event_name == 'schedule'
        run: cargo xtask mutation
