name: Install pinned cargo-mutants
description: Install and verify the approved cargo-mutants release for hosted x64 runners.
runs:
  using: composite
  steps:
    - name: Install the pinned release archive
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:RUNNER_ARCH -ne 'X64') { throw 'Unsupported cargo-mutants runner architecture' }
        switch ($env:RUNNER_OS) {
          'Windows' {
            $archive = 'cargo-mutants-x86_64-pc-windows-msvc.zip'
            $checksum = '2a2f00e47d4b458262a41501b0820aa26015fd35779903d2c8b30b2993f36791'
          }
          'Linux' {
            $archive = 'cargo-mutants-x86_64-unknown-linux-gnu.tar.gz'
            $checksum = 'dfe6dc37d0342c891d2829b5a695aa57c2d0edecef7e7d0399a30cc6e206411e'
          }
          default { throw 'Unsupported cargo-mutants runner operating system' }
        }
        $archivePath = Join-Path $env:RUNNER_TEMP $archive
        Invoke-WebRequest -Uri "https://github.com/sourcefrog/cargo-mutants/releases/download/v27.1.0/$archive" -OutFile $archivePath
        if ((Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $checksum) {
          throw 'cargo-mutants archive digest mismatch'
        }
        $destination = Join-Path $env:RUNNER_TEMP 'cargo-mutants'
        New-Item -ItemType Directory -Path $destination | Out-Null
        if ($env:RUNNER_OS -eq 'Windows') {
          Expand-Archive -LiteralPath $archivePath -DestinationPath $destination
        } else {
          tar -xzf $archivePath -C $destination
          if ($LASTEXITCODE -ne 0) { throw 'cargo-mutants archive extraction failed' }
        }
        $destination | Out-File -LiteralPath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Verify the pinned executable version
      shell: pwsh
      run: |
        $version = cargo --locked mutants --version
        if ($LASTEXITCODE -ne 0 -or $version -ne 'cargo-mutants 27.1.0') {
          throw 'cargo-mutants version mismatch'
        }