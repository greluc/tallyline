[package]
name = "tallyline-adapter-platform"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
socket2 = { version = "=0.6.5", default-features = false }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Networking_WinSock"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
static_mut_refs = "deny"
unused_must_use = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
allow_attributes_without_reason = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
missing_safety_doc = "deny"
